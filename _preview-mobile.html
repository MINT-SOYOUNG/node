<!doctype html><html><head><meta charset="utf-8"><title>mobile preview</title>
<style>
body{margin:0;background:#ddd;font-family:sans-serif;display:flex;gap:16px;padding:16px}
figure{margin:0}
figcaption{font-size:12px;margin-bottom:6px;color:#333}
iframe{width:390px;height:820px;border:0;background:#fff;display:block}
</style></head><body>
<figure><figcaption>home @0</figcaption><iframe data-y="0" src="index.html"></iframe></figure>
<figure><figcaption>home @900</figcaption><iframe data-y="900" src="index.html"></iframe></figure>
<figure><figcaption>home @2300</figcaption><iframe data-y="2300" src="index.html"></iframe></figure>
<figure><figcaption>home @4400</figcaption><iframe data-y="4400" src="index.html"></iframe></figure>
<script>
document.querySelectorAll('iframe').forEach(function(f){
  f.addEventListener('load', function(){
    var y = parseInt(f.dataset.y,10);
    setTimeout(function(){ try{ f.contentWindow.scrollTo(0,y); }catch(e){} }, 700);
  });
});
</script>
</body></html>
